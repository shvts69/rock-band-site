<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Pixel art bass guitar cursor, tilted like a normal cursor -->
  <!-- Headstock (top-left) -->
  <rect x="2" y="0" width="2" height="2" fill="#8B4513"/>
  <rect x="0" y="2" width="2" height="2" fill="#A0522D"/>
  <rect x="4" y="2" width="2" height="2" fill="#A0522D"/>
  <rect x="1" y="2" width="2" height="2" fill="#8B4513"/>
  <!-- Tuning pegs -->
  <rect x="0" y="1" width="1" height="1" fill="#C0C0C0"/>
  <rect x="5" y="1" width="1" height="1" fill="#C0C0C0"/>
  <rect x="0" y="3" width="1" height="1" fill="#C0C0C0"/>
  <rect x="5" y="3" width="1" height="1" fill="#C0C0C0"/>
  <!-- Neck -->
  <rect x="2" y="4" width="2" height="2" fill="#8B4513"/>
  <rect x="2" y="6" width="2" height="2" fill="#A0522D"/>
  <rect x="2" y="8" width="2" height="2" fill="#8B4513"/>
  <rect x="2" y="10" width="2" height="2" fill="#A0522D"/>
  <!-- Frets on neck -->
  <rect x="2" y="5" width="2" height="1" fill="#D2B48C"/>
  <rect x="2" y="7" width="2" height="1" fill="#D2B48C"/>
  <rect x="2" y="9" width="2" height="1" fill="#D2B48C"/>
  <!-- Strings -->
  <rect x="2" y="4" width="1" height="8" fill="rgba(200,200,200,0.4)"/>
  <rect x="3" y="4" width="1" height="8" fill="rgba(200,200,200,0.3)"/>
  <!-- Body (bottom-right, angled) -->
  <rect x="0" y="12" width="8" height="2" fill="#CC0000"/>
  <rect x="0" y="14" width="10" height="2" fill="#AA0000"/>
  <rect x="0" y="16" width="10" height="2" fill="#CC0000"/>
  <rect x="0" y="18" width="10" height="2" fill="#AA0000"/>
  <rect x="0" y="20" width="10" height="2" fill="#CC0000"/>
  <rect x="0" y="22" width="8" height="2" fill="#AA0000"/>
  <rect x="1" y="24" width="6" height="2" fill="#880000"/>
  <!-- Body contour/cutaway -->
  <rect x="0" y="12" width="1" height="2" fill="#880000"/>
  <rect x="9" y="14" width="1" height="8" fill="#880000"/>
  <!-- Pickups -->
  <rect x="3" y="15" width="4" height="1" fill="#333"/>
  <rect x="3" y="19" width="4" height="1" fill="#333"/>
  <!-- Pickup poles -->
  <rect x="3" y="15" width="1" height="1" fill="#666"/>
  <rect x="5" y="15" width="1" height="1" fill="#666"/>
  <rect x="3" y="19" width="1" height="1" fill="#666"/>
  <rect x="5" y="19" width="1" height="1" fill="#666"/>
  <!-- Bridge -->
  <rect x="2" y="22" width="5" height="1" fill="#C0C0C0"/>
  <!-- Knobs -->
  <rect x="7" y="20" width="2" height="2" fill="#222"/>
  <rect x="7" y="16" width="2" height="2" fill="#222"/>
  <!-- Pickguard edge -->
  <rect x="1" y="13" width="1" height="10" fill="#DD2222"/>
</svg>
